{% extends 'base.html' %}

{% block title %}Edit Book{% endblock title %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2>Edit "{{ book.title }}"</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Update Book</button>
        <a href="{% url 'inventory_page' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
