databases:
  - name: mylibrarydb
    databaseName: mylibrarydb
    user: mylibrary_user
    plan: free

services:
  - type: web
    name: my-library-app
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mylibrarydb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: IS_RENDER
        value: "true"